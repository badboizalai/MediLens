# AI Gateway v0 config. Model ids are pinned here, never in code.
# Prices are ASSUMPTIONS (USD per 1K tokens): verify against the provider price list before quoting cost.
default_model = "claude-haiku-5-5"
timeout_s = 20.0
prompt_version = "v0"
cache_ttl_s = 3600

# Cascade (tier "auto"). Env overrides: AI_GATEWAY_TIER_S_MODEL, AI_GATEWAY_TIER_M_MODEL, AI_GATEWAY_ESCALATION_THRESHOLD.
# 0.7 = BR-012 review threshold: below it a field needs user confirmation anyway, so a stronger model is worth trying first.
tier_s_model = "claude-haiku-5-5"
tier_m_model = "claude-sonnet-5-5"
escalation_threshold = 0.7

[providers]
# stub | anthropic | bedrock (real adapters land after v0)
default = "stub"

[allowlist]
models = ["claude-haiku-5-5", "claude-sonnet-5-5"]

[prices_usd_per_1k]
"claude-haiku-5-5" = { input = 0.001, output = 0.005 }
"claude-sonnet-5-5" = { input = 0.003, output = 0.015 }
