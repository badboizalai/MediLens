# AI Gateway v0 config. Model ids are pinned here, never in code.
# Prices are ASSUMPTIONS (USD per 1M tokens): verify against the provider price list before quoting cost.
default_model = "claude-haiku-5-5"
timeout_s = 20.0
prompt_version = "v0"
cache_ttl_s = 3600

[providers]
# stub | anthropic | bedrock (real adapters land after v0)
default = "stub"

[allowlist]
models = ["claude-haiku-5-5", "claude-sonnet-5-5"]

[prices_usd_per_mtok]
"claude-haiku-5-5" = { input = 1.0, output = 5.0 }
"claude-sonnet-5-5" = { input = 3.0, output = 15.0 }
