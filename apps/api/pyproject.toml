[project]
name = "medilens-api"
version = "0.1.0"
description = "MediLens FastAPI modular monolith"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
  "boto3>=1.35",
  "structlog>=24.4",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "import-linter>=2.1", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medilens"]

[tool.importlinter]
root_package = "medilens"

[[tool.importlinter.contracts]]
name = "Layers inside each module: api -> application -> domain"
type = "layers"
layers = ["medilens.modules.*.api", "medilens.modules.*.application", "medilens.modules.*.domain"]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Modules are independent (talk via application services / events)"
type = "independence"
modules = [
  "medilens.modules.identity", "medilens.modules.patient", "medilens.modules.document",
  "medilens.modules.extraction", "medilens.modules.anatomy", "medilens.modules.clinical",
  "medilens.modules.knowledge", "medilens.modules.sharing", "medilens.modules.notification",
  "medilens.modules.audit", "medilens.modules.admin",
]
