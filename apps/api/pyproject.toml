[project]
name = "medilens-api"
version = "0.1.0"
description = "MediLens FastAPI modular monolith"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
  "boto3>=1.35",
  "structlog>=24.4",
  "PyJWT[crypto]>=2.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "import-linter>=2.1", "mypy>=1.13", "testcontainers[postgres]>=4.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medilens"]

[tool.importlinter]
root_package = "medilens"

[[tool.importlinter.contracts]]
name = "identity: api -> application -> domain"
type = "layers"
layers = ["medilens.modules.identity.api", "medilens.modules.identity.application", "medilens.modules.identity.domain"]

[[tool.importlinter.contracts]]
name = "patient: api -> application -> domain"
type = "layers"
layers = ["medilens.modules.patient.api", "medilens.modules.patient.application", "medilens.modules.patient.domain"]

[[tool.importlinter.contracts]]
name = "document: api -> application -> domain"
type = "layers"
layers = ["medilens.modules.document.api", "medilens.modules.document.application", "medilens.modules.document.domain"]

[[tool.importlinter.contracts]]
name = "extraction: api -> application -> domain"
type = "layers"
layers = ["medilens.modules.extraction.api", "medilens.modules.extraction.application", "medilens.modules.extraction.domain"]

[[tool.importlinter.contracts]]
name = "anatomy: api -> application -> domain"
type = "layers"
layers = ["medilens.modules.anatomy.api", "medilens.modules.anatomy.application", "medilens.modules.anatomy.domain"]

[[tool.importlinter.contracts]]
name = "clinical: api -> application -> domain"
type = "layers"
layers = ["medilens.modules.clinical.api", "medilens.modules.clinical.application", "medilens.modules.clinical.domain"]

[[tool.importlinter.contracts]]
name = "knowledge: api -> application -> domain"
type = "layers"
layers = ["medilens.modules.knowledge.api", "medilens.modules.knowledge.application", "medilens.modules.knowledge.domain"]

[[tool.importlinter.contracts]]
name = "sharing: api -> application -> domain"
type = "layers"
layers = ["medilens.modules.sharing.api", "medilens.modules.sharing.application", "medilens.modules.sharing.domain"]

[[tool.importlinter.contracts]]
name = "notification: api -> application -> domain"
type = "layers"
layers = ["medilens.modules.notification.api", "medilens.modules.notification.application", "medilens.modules.notification.domain"]

[[tool.importlinter.contracts]]
name = "audit: api -> application -> domain"
type = "layers"
layers = ["medilens.modules.audit.api", "medilens.modules.audit.application", "medilens.modules.audit.domain"]

[[tool.importlinter.contracts]]
name = "admin: api -> application -> domain"
type = "layers"
layers = ["medilens.modules.admin.api", "medilens.modules.admin.application", "medilens.modules.admin.domain"]

[[tool.importlinter.contracts]]
name = "Modules are independent (talk via application services / events)"
type = "independence"
modules = [
  "medilens.modules.identity",
  "medilens.modules.patient",
  "medilens.modules.document",
  "medilens.modules.extraction",
  "medilens.modules.anatomy",
  "medilens.modules.clinical",
  "medilens.modules.knowledge",
  "medilens.modules.sharing",
  "medilens.modules.notification",
  "medilens.modules.audit",
  "medilens.modules.admin",
]
# Authentication is a cross-cutting identity concern: routers may depend on the current Principal.
ignore_imports = [
  "medilens.modules.*.api.* -> medilens.modules.identity.api.dependencies",
  "medilens.modules.*.api.* -> medilens.modules.identity.domain.principal",
]
