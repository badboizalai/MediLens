# General clinical abbreviations VI/EN -> full terms (S7-T62). Own-authored; no licensed text. Owner: clinical-informaticist.
# Expansion explains vocabulary only; it does not label a condition for the reader (BR-042).
# More than one `expansions` entry = ambiguous abbreviation: the normaliser returns all candidates, never picks one.
# Dental shorthand lives in dental-terms.v1.yaml (`abbrev`) and is merged at load time.
- {abbr: HA, expansions: [{vi: huyết áp, en: blood pressure}]}
