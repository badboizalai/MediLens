name: medilens
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medilens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medilens_dev}
      POSTGRES_DB: ${POSTGRES_DB:-medilens}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-medilens}"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  # S3-compatible object storage for local dev (MinIO community images are no longer published)
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data
    ports: ["9000:8333"]
    volumes: [s3data:/data]
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]
volumes:
  pgdata:
  s3data:
