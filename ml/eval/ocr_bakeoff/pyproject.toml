[project]
name = "medilens-ocr-bakeoff"
version = "0.1.0"
description = "OCR bake-off harness (PaddleOCR vs VietOCR vs LLM vision) on golden-v0 (synthetic data only)"
requires-python = ">=3.10,<3.13"
# Heavy engine deps live only in this env (never in the root workspace).
dependencies = [
  "pillow>=10",
  "tomli>=2; python_version < '3.11'",
  "numpy<2",
  "setuptools<81",  # vietocr/paddle import pkg_resources
  "paddlepaddle==2.6.2",
  "paddleocr==2.8.1",
  "vietocr==0.3.13",
  "torch>=2.2",
  "torchvision",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["S101", "E501", "N818", "UP038"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
